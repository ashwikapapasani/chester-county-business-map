<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chester County Chamber Business Heat Map — Exact</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#172033;--muted:#667085;--border:#dfe3ea;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--border);padding:18px;overflow:auto}
h1{font-size:20px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:14px}
.search{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:1px solid var(--border);background:#fff;padding:8px 10px;border-radius:9px;cursor:pointer}
button:hover{background:#f3f4f6}
.status{font-size:12px;color:var(--muted);margin:8px 0 8px;line-height:1.4}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:6px 0 12px}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.note{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:9px;font-size:12px;line-height:1.35;margin:10px 0}
.section-title{font-weight:700;font-size:13px;margin:14px 0 8px}
.checkrow{display:flex;align-items:flex-start;gap:8px;margin:7px 0;font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;margin-top:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.count{margin-left:auto;color:var(--muted);font-size:11px}
.mapwrap{position:relative;min-width:0}
#map{width:100%;height:100vh}
.map-card{position:absolute;z-index:500;top:12px;right:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px 11px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.10)}
.leaflet-tooltip.business-tip{background:#fff;color:#111827;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.popup-title{font-weight:700;font-size:14px;margin-bottom:4px}
.popup-row{margin:3px 0;font-size:12px}
.popup-row a{color:#1d4ed8;text-decoration:none}
.match{font-size:11px;color:#667085;margin-top:5px}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 68vh;height:auto}.side{max-height:42vh;border-right:0;border-bottom:1px solid var(--border)}#map{height:68vh}}

/* Chamber branding */
:root{
  --chamber-navy:#061d35;
  --chamber-navy-2:#082a4a;
  --chamber-teal:#0798bd;
  --chamber-line:rgba(30,174,207,.34);
}
.side{
  background:linear-gradient(180deg,var(--chamber-navy) 0%,var(--chamber-navy-2) 100%);
  color:#fff;
  border-right:1px solid #0d4268;
  padding:18px;
}
.brand-wrap{
  padding:2px 2px 16px;
  margin-bottom:14px;
  border-bottom:1px solid var(--chamber-line);
}
.brand-logo{
  display:block;
  width:100%;
  max-width:285px;
  height:auto;
  object-fit:contain;
}
.side h1{color:#fff;font-size:19px;margin:0 0 5px}
.side .sub{color:#c7d9e8}
.side .section-title{
  color:#fff;
  border-top:1px solid var(--chamber-line);
  padding-top:13px;
  letter-spacing:.02em;
}
.side .checkrow{color:#fff}
.side .count{color:#b9ccdc}
.side .search{
  color:#fff;
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.26);
  outline:none;
}
.side .search::placeholder{color:#b7c8d7}
.side .search:focus{
  border-color:#39b9d6;
  box-shadow:0 0 0 2px rgba(57,185,214,.18);
}
.side button{
  color:#fff;
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.28);
}
.side button:hover{background:rgba(255,255,255,.15)}
.side input[type="checkbox"]{accent-color:#16a9cc}
.side::-webkit-scrollbar{width:9px}
.side::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:10px}


.production-export{
  width:100%;
  margin:0 0 14px;
  padding:11px 12px;
  border:1px solid rgba(255,255,255,.35)!important;
  background:#0798bd!important;
  color:#fff!important;
  font-weight:700;
  border-radius:9px;
  cursor:pointer;
}
.production-export:hover{background:#0aa8cf!important}
.production-export:disabled{opacity:.55;cursor:wait}
.export-hint{
  color:#c7d9e8;
  font-size:11px;
  line-height:1.4;
  margin:-6px 0 12px;
}

</style>

const industryColors={"Advertising/Marketing/Media": "#e6194b", "Agriculture": "#3cb44b", "Art/Entertainment/Recreation": "#4363d8", "Business/Professional Services": "#f58231", "Community/Civic/Nonprofit Organizations": "#911eb4", "Computers/Technology/Telecom": "#46f0f0", "Education": "#f032e6", "Employment/Staffing Services": "#bcf60c", "Event Planning/Venues": "#fabebe", "Finance/Insurance": "#008080", "Government": "#e6beff", "Healthcare/Wellness": "#9a6324", "Home/Garden": "#fffac8", "Industrial/Manufacturing/Distribution": "#800000", "Lodging/Travel": "#aaffc3", "Maintenance/Repairs/Installation": "#808000", "Personal Services": "#ffd8b1", "Pets/Veterinary": "#000075", "Real Estate/Construction": "#808080", "Restaurants/Food/Beverage": "#ff4500", "Retail": "#2e8b57", "Transportation": "#1e90ff", "Uncategorized": "#8b008b", "Utilities/Environmental": "#6b8e23"};
const map=L.map('map',{preferCanvas:true}).setView([39.99,-75.61],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

const markerLayer=L.layerGroup().addTo(map);
let heatLayer=L.heatLayer([],{radius:24,blur:18,maxZoom:15}).addTo(map);
const markerById=new Map(),coordsById=new Map(),scoreById=new Map(),matchById=new Map();
const selectedIndustries=new Set(Object.keys(industryColors));
const counts={};businesses.forEach(b=>counts[b.industry]=(counts[b.industry]||0)+1);

const filters=document.getElementById('filters');
Object.keys(industryColors).forEach(industry=>{
  const row=document.createElement('label');row.className='checkrow';
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.industry=industry;
  cb.addEventListener('change',()=>{cb.checked?selectedIndustries.add(industry):selectedIndustries.delete(industry);updateDisplay();});
  const dot=document.createElement('span');dot.className='dot';dot.style.background=industryColors[industry];
  const text=document.createElement('span');text.textContent=industry;
  const count=document.createElement('span');count.className='count';count.textContent=counts[industry]||0;
  row.append(cb,dot,text,count);filters.appendChild(row);
});

function esc(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);}
function popupHtml(b){
  const web=b.website?`<a href="${esc(b.website)}" target="_blank" rel="noopener">Visit website</a>`:'Not listed';
  const gm=b.address?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.address)}" target="_blank" rel="noopener">Open address in Google Maps</a>`:'';
  const score=scoreById.get(b.id);
  const match=matchById.get(b.id);
  return `<div class="popup-title">${esc(b.name)}</div>
    <div class="popup-row"><b>Industry:</b> ${esc(b.industry)}</div>
    <div class="popup-row"><b>Address:</b> ${esc(b.address||'Not listed')}</div>
    <div class="popup-row"><b>Phone:</b> ${esc(b.phone||'Not listed')}</div>
    <div class="popup-row"><b>Website:</b> ${web}</div>
    ${gm?`<div class="popup-row">${gm}</div>`:''}
    ${score!=null?`<div class="match">Geocoder match: ${score}/100${match?' · '+esc(match):''}</div>`:''}`;
}
function tooltipHtml(b){return `<b>${esc(b.name)}</b><br>${esc(b.industry)}<br>${esc(b.address||'')}${b.phone?'<br>'+esc(b.phone):''}`;}
function matches(b){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const text=`${b.name} ${b.industry} ${b.address} ${b.city} ${b.state} ${b.zip}`.toLowerCase();
  return selectedIndustries.has(b.industry)&&(!q||text.includes(q));
}
function cacheKey(b){return 'ccbi_exact_v3_'+b.id+'_'+b.address.toLowerCase().replace(/\s+/g,' ').trim();}
function addMarker(b,lat,lon,score,match){
  const c=[Number(lat),Number(lon)];
  if(!isFinite(c[0])||!isFinite(c[1]))return;
  coordsById.set(b.id,c); if(score!=null)scoreById.set(b.id,score); if(match)matchById.set(b.id,match);
  if(!markerById.has(b.id)){
    const m=L.circleMarker(c,{radius:6,color:'#fff',weight:1.2,fillColor:industryColors[b.industry]||'#444',fillOpacity:.92});
    m.bindTooltip(tooltipHtml(b),{className:'business-tip',direction:'top',offset:[0,-4]});
    m.bindPopup(()=>popupHtml(b),{maxWidth:320});
    markerById.set(b.id,m);
  }
}
function updateDisplay(){
  markerLayer.clearLayers();const heat=[];let visible=0;
  businesses.forEach(b=>{if(!matches(b))return;visible++;const c=coordsById.get(b.id);if(!c)return;
    if(document.getElementById('pinsToggle').checked)markerLayer.addLayer(markerById.get(b.id));
    if(document.getElementById('heatToggle').checked)heat.push([c[0],c[1],.55]);
  });
  heatLayer.setLatLngs(heat);
  document.getElementById('mappedCount').textContent=coordsById.size;
  document.getElementById('visibleCount').textContent=visible;
}
function loadCache(){
  let n=0;
  businesses.forEach(b=>{
    if(!b.address)return;
    try{
      const raw=localStorage.getItem(cacheKey(b));if(!raw)return;
      const o=JSON.parse(raw);
      if(o&&isFinite(o.lat)&&isFinite(o.lon)){addMarker(b,o.lat,o.lon,o.score,o.match);n++;}
    }catch(e){}
  });
  return n;
}
function saveCache(b,lat,lon,score,match){
  try{localStorage.setItem(cacheKey(b),JSON.stringify({lat,lon,score,match}));}catch(e){}
}
function setProgress(done,total,msg){
  document.getElementById('bar').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('status').textContent=msg;
}

async function batchGeocode(batch){
  const records=batch.map(b=>({attributes:{
    OBJECTID:b.id,
    Address:b.street||'',
    City:b.city||'',
    Region:b.state||'',
    Postal:b.zip||'',
    CountryCode:'USA'
  }}));
  const form=new URLSearchParams();
  form.set('f','json');
  form.set('addresses',JSON.stringify({records}));
  form.set('sourceCountry','USA');
  form.set('outSR','4326');
  form.set('outFields','ResultID,Match_addr,Addr_type');
  form.set('locationType','rooftop');
  form.set('interpolatePointAddress','true');
  const res=await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/geocodeAddresses',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
    body:form.toString()
  });
  if(!res.ok)throw new Error('Batch HTTP '+res.status);
  const j=await res.json();
  if(j.error)throw new Error(j.error.message||'Batch geocoding failed');
  return j.locations||[];
}

async function singleGeocode(b){
  const p=new URLSearchParams({
    f:'json',
    SingleLine:b.address,
    sourceCountry:'USA',
    outSR:'4326',
    outFields:'Match_addr,Addr_type',
    locationType:'rooftop',
    interpolatePointAddress:'true',
    maxLocations:'1'
  });
  const res=await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?'+p.toString());
  if(!res.ok)return null;
  const j=await res.json();
  const c=j.candidates&&j.candidates[0];
  return c?{id:b.id,lat:c.location.y,lon:c.location.x,score:c.score,match:c.address}:null;
}

async function fallbackConcurrent(todo,completed,total){
  let index=0,done=completed;
  const workers=Array.from({length:18},async()=>{
    while(true){
      const i=index++; if(i>=todo.length)return;
      const b=todo[i];
      try{
        const r=await singleGeocode(b);
        if(r){addMarker(b,r.lat,r.lon,r.score,r.match);saveCache(b,r.lat,r.lon,r.score,r.match);}
      }catch(e){}
      done++;setProgress(done,total,`Locating exact street addresses… ${done} / ${total}`);
      if(done%10===0)updateDisplay();
    }
  });
  await Promise.all(workers);
  return done;
}

async function initExact(){
  const cached=loadCache();updateDisplay();
  const todo=businesses.filter(b=>b.address&&!coordsById.has(b.id));
  const noAddress=businesses.filter(b=>!b.address).length;
  const total=cached+todo.length;
  setProgress(cached,total, cached?`Loaded ${cached} cached exact locations. Finishing the rest…`:'Batch-locating exact street addresses…');

  let done=cached;
  const failed=[];
  const chunkSize=100;
  for(let i=0;i<todo.length;i+=chunkSize){
    const chunk=todo.slice(i,i+chunkSize);
    try{
      const results=await batchGeocode(chunk);
      const byId=new Map(results.map(r=>[Number(r.attributes&&r.attributes.ResultID),r]));
      for(const b of chunk){
        const r=byId.get(Number(b.id));
        if(r&&r.location&&r.score>=70){
          const lat=r.location.y,lon=r.location.x,score=r.score,match=(r.attributes&&r.attributes.Match_addr)||r.address||'';
          addMarker(b,lat,lon,score,match);saveCache(b,lat,lon,score,match);
        }else failed.push(b);
        done++;
      }
      updateDisplay();
      setProgress(done,total,`Batch-locating exact street addresses… ${done} / ${total}`);
    }catch(e){
      // If batch authorization/rate limits fail, retry these addresses concurrently.
      failed.push(...chunk);
      done+=chunk.length;
      setProgress(done,total,`Batch service unavailable for one group; switching those to fast concurrent lookup…`);
    }
  }

  // retry failed/missing results concurrently; reset done accounting so progress is meaningful
  if(failed.length){
    const alreadyMapped=coordsById.size;
    await fallbackConcurrent(failed,alreadyMapped,total);
  }

  updateDisplay();
  const mapped=coordsById.size;
  const missing=businesses.length-mapped;
  document.getElementById('bar').style.width='100%';
  document.getElementById('status').textContent=
    `Ready: ${mapped} exact geocoded business locations${missing?` · ${missing} could not be matched or lacked an address`:''}${noAddress?` · ${noAddress} had no street address`:''}.`;

  if(mapped){
    const paBusinesses=businesses.filter(b=>coordsById.has(b.id)&&b.state==='PA');
    const pts=paBusinesses.map(b=>coordsById.get(b.id));
    if(pts.length>1)map.fitBounds(pts,{padding:[30,30],maxZoom:11});
  }
}

document.getElementById('search').addEventListener('input',updateDisplay);
document.getElementById('pinsToggle').addEventListener('change',updateDisplay);
document.getElementById('heatToggle').addEventListener('change',updateDisplay);
document.getElementById('selectAll').addEventListener('click',()=>{selectedIndustries.clear();document.querySelectorAll('#filters input[type=checkbox]').forEach(cb=>{cb.checked=true;selectedIndustries.add(cb.dataset.industry)});updateDisplay();});
document.getElementById('clearAll').addEventListener('click',()=>{selectedIndustries.clear();document.querySelectorAll('#filters input[type=checkbox]').forEach(cb=>cb.checked=false);updateDisplay();});
document.getElementById('resetView').addEventListener('click',()=>map.setView([39.99,-75.61],10));


function buildProductionHtml(){
  const enriched = businesses.map(b => {
    const c = coordsById.get(b.id);
    return Object.assign({}, b, c ? {
      lat: Number(c[0]),
      lon: Number(c[1]),
      geoScore: scoreById.get(b.id) ?? null,
      geoMatch: matchById.get(b.id) ?? ""
    } : {});
  });

  let source = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  // Embed the coordinates that are already loaded in this browser.
  const businessPattern = /const businesses=\[[\s\S]*?\];\s*const industryColors=/;
  source = source.replace(
    businessPattern,
    'const businesses=' + JSON.stringify(enriched) + ';\\nconst industryColors='
  );

  // Remove the one-time export controls from the production copy.
  source = source.replace(/<button id="prodExport"[\s\S]*?<\/button>/, '');
  source = source.replace(/<div id="exportHint"[\s\S]*?<\/div>/, '');

  // Add a static initializer that never calls a geocoder.
  const staticInit = `
function initProductionStatic(){
  let mapped=0;
  businesses.forEach(b=>{
    if(Number.isFinite(Number(b.lat)) && Number.isFinite(Number(b.lon))){
      addMarker(b, Number(b.lat), Number(b.lon), b.geoScore ?? null, b.geoMatch || '');
      mapped++;
    }
  });
  updateDisplay();
  const status=document.getElementById('status');
  if(status) status.style.display='none';
  const progress=document.querySelector('.progress');
  if(progress) progress.style.display='none';
  const pts=businesses
    .filter(b=>b.state==='PA' && Number.isFinite(Number(b.lat)) && Number.isFinite(Number(b.lon)))
    .map(b=>[Number(b.lat),Number(b.lon)]);
  if(pts.length>1) map.fitBounds(pts,{padding:[30,30],maxZoom:11});
}
`;

  source = source.replace(
    'updateDisplay();initExact();',
    staticInit + '\\nupdateDisplay();initProductionStatic();'
  );

  // Prevent the builder-only listener from surviving in the production copy.
  source = source.replace(/document\.getElementById\('prodExport'\)[\s\S]*?addEventListener\('click',[\s\S]*?\}\);/, '');

  return source;
}

function downloadProductionHtml(){
  const btn=document.getElementById('prodExport');
  const hint=document.getElementById('exportHint');
  if(coordsById.size===0){
    hint.textContent='The locations have not loaded yet. Please wait a moment and try again.';
    return;
  }
  const source=buildProductionHtml();
  const blob=new Blob([source],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='Chester_County_Chamber_Instant_Embedded_Map.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  hint.textContent='Done — use the downloaded “Instant Embedded Map” file for GitHub Pages or the Chamber website.';
}

document.getElementById('prodExport').addEventListener('click',downloadProductionHtml);


updateDisplay();initExact();
</script>
